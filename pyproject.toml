[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuityos"
version = "1.2.1"
description = "Local-first modular operating layer for AI applications"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "fastapi>=0.115", "typer>=0.15", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.8.6"]
litellm = ["litellm>=1.0"]
observability = ["opentelemetry-api>=1.0", "opentelemetry-sdk>=1.0", "langfuse>=2.0"]
memory = ["mem0ai>=0.1", "graphiti-core>=0.29"]
durable = ["dbos>=2"]
guardrails = ["nemoguardrails>=0.10"]
voice = ["pipecat-ai>=1.8"]
full = [
  "litellm>=1.0",
  "opentelemetry-api>=1.0",
  "opentelemetry-sdk>=1.0",
  "langfuse>=2.0",
  "mem0ai>=0.1",
  "graphiti-core>=0.29",
  "dbos>=2",
  "nemoguardrails>=0.10",
  "pipecat-ai>=1.8",
]

[project.scripts]
continuity = "continuityos.cli:app"

[tool.setuptools]
package-dir = {"" = "packages/python"}

[tool.setuptools.packages.find]
where = ["packages/python"]

[tool.pytest.ini_options]
pythonpath = ["packages/python", "."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F821"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E701", "E702"]
