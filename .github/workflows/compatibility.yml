name: compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m compileall -q packages/python services
