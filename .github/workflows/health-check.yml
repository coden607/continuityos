name: health-check
on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'
permissions:
  contents: read
jobs:
  core-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: continuity doctor
      - run: continuity health
      - run: pytest -q
