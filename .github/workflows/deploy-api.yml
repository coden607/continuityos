name: deploy-api

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/python/**'
      - 'pyproject.toml'
      - 'wrangler.api.jsonc'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv
      - name: Stage API Wrangler config
        run: cp wrangler.api.jsonc wrangler.jsonc
      - name: Validate Python Worker bundle
        run: uv run --python 3.13 --with workers-py --with workers-runtime-sdk pywrangler deploy --dry-run

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Install uv
        run: python -m pip install uv
      - name: Stage API Wrangler config
        run: cp wrangler.api.jsonc wrangler.jsonc
      - name: Deploy ContinuityOS API Worker
        run: uv run --python 3.13 --with workers-py --with workers-runtime-sdk pywrangler deploy --strict
